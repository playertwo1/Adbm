name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create .env file for build
        # The Secrets Gradle Plugin accepts an empty properties file, but an
        # empty value such as `MAPS_API_KEY=` generates invalid BuildConfig
        # Java (`public static final String MAPS_API_KEY = ;`). The app does
        # not currently use Google Maps, so no placeholder key is needed.
        run: touch .env

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
