name: Verify and Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed phone and Wear APKs after verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Create empty local environment file
        run: touch .env
      - name: Run project check
        run: bash scripts/check.sh

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Create empty local environment file
        run: touch .env
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required secret is absent: ${secret_name}"
              exit 1
            fi
          done
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coreflow-upload.jks"
      - name: Build signed release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/coreflow-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: 1.1.${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: CoreFlow-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish phone and watch APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.1.${{ github.run_number }}
        run: |
          shopt -s nullglob
          phone_apks=(app/build/outputs/apk/release/*.apk)
          watch_apks=(wear/build/outputs/apk/release/*.apk)
          if [ "${#phone_apks[@]}" -ne 1 ] || [ "${#watch_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one phone APK and one Wear APK."
            exit 1
          fi
          phone_asset="CoreFlow-${RELEASE_TAG}.apk"
          watch_asset="CoreFlow-Watch-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "${phone_apks[0]}#${phone_asset}" \
              "${watch_apks[0]}#${watch_asset}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${phone_apks[0]}#${phone_asset}" \
              "${watch_apks[0]}#${watch_asset}" \
              --target "$GITHUB_SHA" \
              --title "CoreFlow ${RELEASE_TAG}" \
              --notes "Signed phone and Wear OS APKs."
          fi
