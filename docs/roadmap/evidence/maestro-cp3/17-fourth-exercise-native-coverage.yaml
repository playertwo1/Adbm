appId: com.aistudio.coreflow.vdfpkw
---
- launchApp
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "nav-btn-pausas"
- scrollUntilVisible:
    element:
      id: "stretch-btn-4"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "stretch-btn-4"
- extendedWaitUntil:
    visible: "Abrir"
    timeout: 8000
- takeScreenshot: cp3-exercise-4-mini-native-entry
- tapOn: "Abrir controles do treino"
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 6000
- assertVisible: "Direita"
- takeScreenshot: cp3-exercise-4-native-guide
- tapOn: "Cancelar treino"
- assertVisible: "Cancelar treino?"
- tapOn: "Cancelar sessão"
- extendedWaitUntil:
    notVisible: "Recolher"
    timeout: 6000
- takeScreenshot: cp3-exercise-4-native-cancelled
