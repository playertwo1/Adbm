appId: com.aistudio.coreflow.vdfpkw
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 30000
- tapOn:
    id: "nav-btn-pausas"
- scrollUntilVisible:
    element:
      id: "breath-btn-caixa"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "breath-btn-caixa"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Abrir"
    timeout: 15000
- tapOn:
    text: "Abrir"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 10000
- assertVisible: "Pausar treino"
- takeScreenshot: "cp4-breath-foreground-before-home"
- pressKey: HOME
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 10000
- assertVisible: "Pausar treino"
- takeScreenshot: "cp4-breath-overlay-on-launcher"
- assertVisible: "Pausar treino"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 15000
- assertVisible: "Pausar treino"
- takeScreenshot: "cp4-breath-after-return"
- tapOn:
    text: "Cancelar treino"
    waitToSettleTimeoutMs: 0
- assertVisible: "Cancelar treino?"
- tapOn:
    text: "Cancelar sessão"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible: "Recolher"
    timeout: 10000
- takeScreenshot: "cp4-breath-background-cancelled"
