appId: com.aistudio.coreflow.vdfpkw
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 30000
- tapOn:
    id: "nav-btn-pausas"
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- assertVisible: "Expiração Longa"
- tapOn:
    id: "breath-btn-longa"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Abrir"
    timeout: 15000
- tapOn:
    text: "Abrir"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 10000
- assertVisible: "Pausar treino"
- takeScreenshot: "cp4-longa-running"
- tapOn:
    text: "Cancelar treino"
    waitToSettleTimeoutMs: 0
- assertVisible: "Cancelar treino?"
- tapOn:
    text: "Confirmar cancelamento da sessão"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
