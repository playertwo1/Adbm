appId: com.aistudio.coreflow.vdfpkw
---
- tapOn:
    id: "nav-btn-perfil"
- scrollUntilVisible:
    element:
      id: "profileAccessibilityButton"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "profileAccessibilityButton"
- takeScreenshot: "cp4-reduced-motion-state-before-probe"
- tapOn:
    text: "Alternar redução de movimento"
    waitToSettleTimeoutMs: 0
- takeScreenshot: "cp4-reduced-motion-state-after-probe"
- tapOn: "Concluir"
