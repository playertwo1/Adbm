appId: com.aistudio.coreflow.vdfpkw
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    point: "42%, 94%"
- waitForAnimationToEnd
- tapOn:
    point: "75%, 64%"
- waitForAnimationToEnd
- tapOn:
    point: "60%, 14%"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: "cp2-compact-cancel-visible"
- tapOn:
    point: "80%, 14%"
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: "Cancelar treino?"
- takeScreenshot: "cp2-compact-cancel-confirmation"
- tapOn: "Cancelar sessão"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "cp2-compact-cancelled"
