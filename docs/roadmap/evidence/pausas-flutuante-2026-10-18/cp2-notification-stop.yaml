appId: com.aistudio.coreflow.vdfpkw
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    point: "42%, 94%"
- waitForAnimationToEnd
- tapOn:
    point: "75%, 64%"
- waitForAnimationToEnd
- takeScreenshot: "cp2-notification-session-started"
- swipe:
    start: "50%, 1%"
    end: "50%, 75%"
- waitForAnimationToEnd
- takeScreenshot: "cp2-notification-stop-action"
- assertVisible: "Parar"
- tapOn: "Parar"
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%, 75%"
    end: "50%, 1%"
- waitForAnimationToEnd
- takeScreenshot: "cp2-notification-stop-result"
