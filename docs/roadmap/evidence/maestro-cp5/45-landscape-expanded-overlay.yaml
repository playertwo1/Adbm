appId: com.aistudio.coreflow.vdfpkw
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 30000
- tapOn:
    id: "nav-btn-pausas"
- scrollUntilVisible:
    element:
      id: "breath-btn-caixa"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "breath-btn-caixa"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Abrir"
    timeout: 15000
- tapOn:
    text: "Abrir"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 10000
- assertVisible: "Pausar treino"
- assertVisible: "Pular para o próximo passo"
- assertVisible: "Cancelar treino"
- takeScreenshot: "cp5-landscape-expanded-overlay"
- tapOn:
    text: "Cancelar treino"
    waitToSettleTimeoutMs: 0
- assertVisible: "Cancelar treino?"
- tapOn:
    text: "Confirmar cancelamento da sessão"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible: "Recolher"
    timeout: 10000
