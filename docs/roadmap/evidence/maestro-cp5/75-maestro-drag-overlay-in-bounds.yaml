appId: com.aistudio.coreflow.vdfpkw
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 30000
- tapOn:
    id: "nav-btn-pausas"
- scrollUntilVisible:
    element:
      id: "breath-btn-caixa"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "breath-btn-caixa"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Abrir"
    timeout: 20000
- tapOn:
    text: "Abrir"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 10000
- takeScreenshot: "cp5-maestro-drag-before"
- swipe:
    start: "20%, 16%"
    end: "46%, 16%"
- assertVisible: "Recolher"
- assertVisible: "Pausar treino"
- assertVisible: "Cancelar treino"
- takeScreenshot: "cp5-maestro-drag-after"
- tapOn:
    text: "Cancelar treino"
    waitToSettleTimeoutMs: 0
- tapOn:
    text: "Confirmar cancelamento da sessão"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible: "Recolher"
    timeout: 15000
