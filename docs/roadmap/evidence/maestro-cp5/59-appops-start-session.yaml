appId: com.aistudio.coreflow.vdfpkw
---
- launchApp:
    stopApp: true
- tapOn:
    id: "nav-btn-pausas"
- scrollUntilVisible:
    element:
      id: "breath-btn-caixa"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "breath-btn-caixa"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Abrir"
    timeout: 15000
- tapOn:
    text: "Abrir"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Recolher"
    timeout: 10000
- assertVisible: "Pausar treino"
- takeScreenshot: "cp5-appops-before-deny"
