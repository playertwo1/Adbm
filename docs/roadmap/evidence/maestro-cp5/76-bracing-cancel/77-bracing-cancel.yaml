- takeScreenshot: cp5-bracing-active-before-cancel
- tapOn:
    point: "30%, 74%"
- extendedWaitUntil:
    visible: "Manter Postura 2min"
    timeout: 8000
- assertVisible: "02:00"
- takeScreenshot: cp5-bracing-reset-after-cancel
