<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Referência de pílulas do treino flutuante CoreFlow</title>
  <desc id="desc">Comparação esquemática do modo compacto atual com uma proposta de altura alinhada, mais os controles mini, expandido e de confirmação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#060a12"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc328"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14cba3"/><stop offset="1" stop-color="#079c7c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <style>
      .h1{font:700 42px Arial,sans-serif;fill:#f6f8fc}.sub{font:400 18px Arial,sans-serif;fill:#9aabc2}
      .section{font:700 17px Arial,sans-serif;letter-spacing:1.6px;fill:#89a1bd}.label{font:700 13px Arial,sans-serif;letter-spacing:1.2px;fill:#788ba5}
      .phase{font:700 22px Arial,sans-serif;fill:#f4f7fc}.program{font:400 17px Arial,sans-serif;fill:#95a7bf}
      .timer{font:700 24px 'Arial',sans-serif;fill:#09c8f2}.button{font:700 18px Arial,sans-serif}.small{font:400 13px Arial,sans-serif;fill:#a6b4c8}
      .divider{stroke:#243144;stroke-width:1}.frame{fill:#0b111d;stroke:#253349;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="56" y="66" class="h1">CoreFlow · Pílulas do treino flutuante</text>
  <text x="58" y="98" class="sub">Referência de proporção e alinhamento · proposta visual para revisão</text>
  <rect x="1310" y="36" width="232" height="42" rx="21" fill="#142236" stroke="#2b3a50"/>
  <text x="1426" y="63" text-anchor="middle" class="label" fill="#9eacc0">REFERÊNCIA · 21 OUT 2026</text>

  <rect x="40" y="132" width="1520" height="382" rx="24" class="frame" filter="url(#shadow)"/>
  <text x="72" y="172" class="section">COMPACTO · COMPARAÇÃO DE ALTURA</text>
  <text x="76" y="207" class="label">ATUAL — ESQUEMÁTICO DA CAPTURA</text>
  <rect x="72" y="224" width="1456" height="112" rx="56" fill="#080d18" stroke="#263449" stroke-width="2"/>
  <circle cx="112" cy="280" r="7" fill="#09b8e8"/>
  <text x="144" y="270" class="phase">PREPARAÇÃO</text>
  <text x="144" y="297" class="program">Bracing: Controle e Automação (8 Semanas)</text>
  <rect x="850" y="258" width="148" height="44" rx="22" fill="#101a29" stroke="#08bfe9" stroke-width="1.5"/>
  <text x="924" y="287" text-anchor="middle" class="timer">00:10</text>
  <rect x="1010" y="240" width="220" height="80" rx="40" fill="url(#amber)"/>
  <text x="1120" y="288" text-anchor="middle" class="button" fill="#15120a">Ⅱ  Pausar</text>
  <rect x="1242" y="240" width="232" height="80" rx="40" fill="#30121b" stroke="#ef607a" stroke-width="1.5"/>
  <text x="1358" y="288" text-anchor="middle" class="button" fill="#ff9caf">Cancelar</text>
  <text x="851" y="356" class="small">Timer: padding vertical 3 dp</text>
  <text x="1133" y="356" class="small">Ações: altura mínima 48 dp</text>

  <text x="76" y="400" class="label">PROPOSTA PARA REVISÃO — MESMA ALTURA E MESMO EIXO VERTICAL</text>
  <rect x="72" y="416" width="1456" height="76" rx="38" fill="#080d18" stroke="#263449" stroke-width="2"/>
  <circle cx="112" cy="454" r="7" fill="#09b8e8"/>
  <text x="144" y="446" class="phase">PREPARAÇÃO</text>
  <text x="144" y="470" class="program">Bracing: Controle e Automação (8 Semanas)</text>
  <rect x="850" y="428" width="148" height="52" rx="26" fill="#101a29" stroke="#08bfe9" stroke-width="1.5"/>
  <text x="924" y="461" text-anchor="middle" class="timer">00:10</text>
  <rect x="1010" y="428" width="220" height="52" rx="26" fill="url(#amber)"/>
  <text x="1120" y="461" text-anchor="middle" class="button" fill="#15120a">Ⅱ  Pausar</text>
  <rect x="1242" y="428" width="232" height="52" rx="26" fill="#30121b" stroke="#ef607a" stroke-width="1.5"/>
  <text x="1358" y="461" text-anchor="middle" class="button" fill="#ff9caf">Cancelar</text>

  <rect x="40" y="538" width="735" height="498" rx="24" class="frame"/>
  <text x="72" y="580" class="section">MINI</text>
  <text x="72" y="610" class="small">Indicador, fase, timer e ação Abrir</text>
  <rect x="72" y="636" width="670" height="82" rx="41" fill="#080d18" stroke="#0fae9b" stroke-width="1.5"/>
  <circle cx="108" cy="677" r="6" fill="#13c7ae"/>
  <text x="132" y="684" class="button" fill="#f4f7fc">PREPARAÇÃO</text>
  <text x="421" y="684" class="timer">00:10</text>
  <text x="647" y="684" text-anchor="end" class="button" fill="#39d5bd">Abrir</text>
  <text x="72" y="758" class="small">Ação de texto, sem fundo próprio.</text>

  <text x="72" y="814" class="section">EXPANDIDO · CONTROLES</text>
  <text x="72" y="844" class="small">Pausar, Pular e Cancelar mantêm a mesma altura.</text>
  <rect x="72" y="870" width="202" height="58" rx="29" fill="url(#amber)"/>
  <text x="173" y="906" text-anchor="middle" class="button" fill="#15120a">Ⅱ  Pausar</text>
  <rect x="286" y="870" width="202" height="58" rx="29" fill="#1e293b" stroke="#46566e"/>
  <text x="387" y="906" text-anchor="middle" class="button" fill="#f4f7fc">»  Pular</text>
  <rect x="500" y="870" width="202" height="58" rx="29" fill="#30121b" stroke="#ef607a"/>
  <text x="601" y="906" text-anchor="middle" class="button" fill="#ff9caf">Cancelar</text>

  <rect x="795" y="538" width="765" height="498" rx="24" class="frame"/>
  <text x="827" y="580" class="section">CONFIRMAÇÃO DE CANCELAMENTO</text>
  <text x="827" y="610" class="small">Duas ações distintas, altura compartilhada.</text>
  <rect x="827" y="646" width="336" height="62" rx="31" fill="#1e293b" stroke="#475569"/>
  <text x="995" y="685" text-anchor="middle" class="button" fill="#f4f7fc">Continuar treino</text>
  <rect x="1177" y="646" width="336" height="62" rx="31" fill="#be123c" stroke="#fb7185"/>
  <text x="1345" y="685" text-anchor="middle" class="button" fill="#fff">Cancelar sessão</text>
  <text x="827" y="778" class="section">RETENÇÃO DE VÁCUO · CONDICIONAL</text>
  <text x="827" y="808" class="small">Ação separada; não faz parte da fileira de pílulas.</text>
  <rect x="827" y="836" width="686" height="60" rx="12" fill="#1a1607" stroke="#f59e0b"/>
  <text x="1170" y="873" text-anchor="middle" class="button" fill="#f8c554">Encerrar Retenção com Segurança</text>
  <text x="827" y="960" class="small">As medidas visuais são esquemáticas. A altura comum na proposta aguarda aprovação humana.</text>

  <line x1="40" y1="1070" x2="1560" y2="1070" class="divider"/>
  <text x="56" y="1097" class="small">Fonte: WorkoutOverlayController.kt · referência de discussão; não é captura nem implementação.</text>
</svg>
