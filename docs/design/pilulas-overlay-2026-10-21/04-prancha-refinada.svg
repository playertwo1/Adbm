<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc">
  <title id="title">Proposta refinada para os controles do treino flutuante CoreFlow</title>
  <desc id="desc">Prancha de referência com os estados mini, compacto, expandido, confirmação de cancelamento e saída segura de retenção. Os botões de cada fileira têm a mesma altura visual, com hierarquia de ação e contraste distintos.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a28"/><stop offset="1" stop-color="#090e16"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151f2e"/><stop offset="1" stop-color="#101722"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18283a"/><stop offset="1" stop-color="#111b29"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".24"/></filter>
    <style>
      .eyebrow{font:700 13px "Segoe UI",Arial,sans-serif;letter-spacing:2.2px;fill:#82a1bd}
      .title{font:700 38px "Segoe UI",Arial,sans-serif;letter-spacing:-.5px;fill:#f5f8fc}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#a9b8ca}
      .section{font:700 15px "Segoe UI",Arial,sans-serif;letter-spacing:1.3px;fill:#8fb4d2}
      .body{font:400 16px "Segoe UI",Arial,sans-serif;fill:#b8c6d6}
      .label{font:700 12px "Segoe UI",Arial,sans-serif;letter-spacing:1.1px;fill:#8094aa}
      .phase{font:700 22px "Segoe UI",Arial,sans-serif;fill:#f5f7fb}
      .program{font:400 16px "Segoe UI",Arial,sans-serif;fill:#b2c1d2}
      .timer{font:700 22px Consolas,"Courier New",monospace;fill:#67dfff}
      .action{font:700 16px "Segoe UI",Arial,sans-serif}
      .actionSmall{font:700 14px "Segoe UI",Arial,sans-serif}
      .note{font:400 13px "Segoe UI",Arial,sans-serif;fill:#91a4b8}
      .panel{fill:url(#surface);stroke:#25354a;stroke-width:1.2}
      .pill{fill:#0c131e;stroke:#29394e;stroke-width:1.3}
      .rule{stroke:#29384a;stroke-width:1}
    </style>
  </defs>
  <rect width="1680" height="1240" fill="url(#canvas)"/>
  <circle cx="1520" cy="72" r="190" fill="#17304b" opacity=".18"/>
  <text x="64" y="54" class="eyebrow">COREFLOW  /  SOBREPOSIÇÃO DE TREINO</text>
  <text x="64" y="105" class="title">Controles alinhados. Ações mais claras.</text>
  <text x="66" y="137" class="subtitle">Pílulas do treino flutuante · proposta visual para revisão</text>
  <rect x="1370" y="48" width="246" height="38" rx="19" fill="#172438" stroke="#32445b"/>
  <circle cx="1393" cy="67" r="4" fill="#67dfff"/>
  <text x="1407" y="72" class="label" fill="#c1d3e4">REFERÊNCIA 01  ·  21 OUT 2026</text>

  <rect x="48" y="168" width="1584" height="275" rx="26" fill="url(#hero)" stroke="#2b4058" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="80" y="207" class="section">01  /  COMPACTO</text>
  <text x="302" y="207" class="body">Timer e ações compartilham o mesmo eixo vertical</text>
  <rect x="80" y="229" width="1520" height="102" rx="51" class="pill"/>
  <circle cx="119" cy="280" r="7" fill="#45c8ed"/>
  <circle cx="119" cy="280" r="13" fill="none" stroke="#45c8ed" stroke-opacity=".23" stroke-width="1.5"/>
  <text x="151" y="274" class="phase">PREPARAÇÃO</text>
  <text x="151" y="300" class="program">Bracing: Controle e Automação (8 Semanas)</text>
  <rect x="921" y="254" width="132" height="52" rx="26" fill="#102637" stroke="#36c8ed" stroke-width="1.4"/>
  <text x="987" y="287" class="timer" text-anchor="middle">00:10</text>
  <rect x="1067" y="254" width="176" height="52" rx="26" fill="#f5b52d"/>
  <rect x="1092" y="272" width="4" height="16" rx="1" fill="#251b08"/>
  <rect x="1101" y="272" width="4" height="16" rx="1" fill="#251b08"/>
  <text x="1170" y="287" class="action" fill="#211908" text-anchor="middle">Pausar</text>
  <rect x="1257" y="254" width="156" height="52" rx="26" fill="#291721" stroke="#d96b82" stroke-width="1.2"/>
  <path d="M1282 274l12 12m0-12l-12 12" stroke="#f3a3b2" stroke-width="2" stroke-linecap="round"/>
  <text x="1344" y="287" class="action" fill="#ffc0ca" text-anchor="middle">Cancelar</text>
  <text x="80" y="374" class="note">REFERÊNCIA DE MEDIDA</text>
  <text x="80" y="400" class="body">Altura visual comum: 52 dp</text>
  <line x1="364" y1="367" x2="364" y2="415" class="rule"/>
  <text x="394" y="374" class="note">TOQUE</text>
  <text x="394" y="400" class="body">Ações interativas: alvo mínimo de 48 dp</text>
  <line x1="846" y1="367" x2="846" y2="415" class="rule"/>
  <text x="876" y="374" class="note">HIERARQUIA</text>
  <text x="876" y="400" class="body">Pausar em destaque · Cancelar em contorno</text>

  <rect x="48" y="467" width="496" height="285" rx="24" class="panel"/>
  <text x="80" y="507" class="section">02  /  MINI</text>
  <text x="80" y="535" class="body">Resumo com acesso evidente aos controles</text>
  <rect x="80" y="565" width="432" height="72" rx="36" class="pill"/>
  <circle cx="110" cy="601" r="6" fill="#45c8ed"/>
  <text x="131" y="607" class="action" fill="#eff5fb">TREINO</text>
  <rect x="258" y="577" width="108" height="48" rx="24" fill="#102637" stroke="#36c8ed" stroke-width="1.2"/>
  <text x="312" y="607" class="timer" text-anchor="middle" font-size="20">00:10</text>
  <line x1="380" y1="583" x2="380" y2="619" stroke="#2c4054"/>
  <text x="404" y="607" class="action" fill="#79d8c1">Abrir</text>
  <path d="M457 597l7 7-7 7" fill="none" stroke="#79d8c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="679" class="note">Abrir mantém área de toque adequada sem adicionar</text>
  <text x="80" y="700" class="note">outro fundo visual à pílula.</text>
  <rect x="80" y="716" width="214" height="22" rx="11" fill="#162437"/>
  <text x="187" y="731" class="label" text-anchor="middle">AÇÃO TEXTUAL  ·  ALVO ≥48 DP</text>

  <rect x="566" y="467" width="1066" height="285" rx="24" class="panel"/>
  <text x="598" y="507" class="section">03  /  EXPANDIDO</text>
  <text x="598" y="535" class="body">Principal preenchida · auxiliar neutra · destrutiva contornada</text>
  <rect x="598" y="557" width="1002" height="126" rx="20" fill="#0d141f" stroke="#26374a"/>
  <text x="624" y="592" class="phase" font-size="19">PREPARAÇÃO</text>
  <text x="624" y="618" class="program" font-size="14">Próximo: Recuperação · 60 s</text>
  <rect x="844" y="610" width="116" height="52" rx="26" fill="#102637" stroke="#36c8ed" stroke-width="1.3"/>
  <text x="902" y="643" class="timer" font-size="19" text-anchor="middle">00:10</text>
  <rect x="970" y="610" width="158" height="52" rx="26" fill="#f5b52d"/>
  <rect x="988" y="628" width="4" height="16" rx="1" fill="#251b08"/>
  <rect x="997" y="628" width="4" height="16" rx="1" fill="#251b08"/>
  <text x="1060" y="643" class="actionSmall" fill="#211908" text-anchor="middle">Pausar</text>
  <rect x="1138" y="610" width="150" height="52" rx="26" fill="#1b2838" stroke="#43566c"/>
  <path d="M1159 625l12 11-12 11v-22zm13 0l12 11-12 11" fill="#d8e4ef"/>
  <text x="1237" y="643" class="actionSmall" fill="#e3ebf4" text-anchor="middle">Pular</text>
  <rect x="1298" y="610" width="148" height="52" rx="26" fill="#291721" stroke="#d96b82"/>
  <text x="1372" y="643" class="actionSmall" fill="#ffc0ca" text-anchor="middle">Cancelar</text>
  <rect x="624" y="696" width="236" height="36" rx="18" fill="#172438"/>
  <text x="742" y="719" class="label" text-anchor="middle">VARIANTE · JÁ PAUSADO</text>
  <rect x="880" y="690" width="180" height="52" rx="26" fill="#167f69"/>
  <path d="M903 704l21 12-21 12z" fill="#e0fff5"/>
  <text x="982" y="723" class="actionSmall" fill="#f1fff9" text-anchor="middle">Continuar</text>

  <rect x="48" y="776" width="778" height="360" rx="24" class="panel"/>
  <text x="80" y="818" class="section">04  /  CONFIRMAÇÃO</text>
  <text x="80" y="848" class="body">Explica o resultado e prioriza a opção de continuar.</text>
  <text x="80" y="887" class="body">A sessão será encerrada sem ser marcada como concluída.</text>
  <text x="80" y="911" class="body">O histórico anterior será mantido.</text>
  <rect x="80" y="947" width="323" height="56" rx="28" fill="#167f69"/>
  <path d="M105 975l7 7 13-15" fill="none" stroke="#e3fff6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="982" class="action" fill="#f1fff9" text-anchor="middle">Continuar treino</text>
  <rect x="419" y="947" width="375" height="56" rx="28" fill="#291721" stroke="#d96b82" stroke-width="1.3"/>
  <path d="M446 969l12 12m0-12l-12 12" stroke="#f3a3b2" stroke-width="2" stroke-linecap="round"/>
  <text x="612" y="982" class="action" fill="#ffc0ca" text-anchor="middle">Cancelar sessão</text>
  <line x1="80" y1="1031" x2="794" y2="1031" class="rule"/>
  <text x="80" y="1064" class="note">Se a sessão já estava pausada, o rótulo seguro passa a</text>
  <text x="80" y="1086" class="note">“Manter treino pausado”. Mesma geometria; texto adaptável.</text>

  <rect x="848" y="776" width="784" height="360" rx="24" class="panel"/>
  <text x="880" y="818" class="section">05  /  SAÍDA SEGURA</text>
  <rect x="1360" y="795" width="240" height="30" rx="15" fill="#332916"/>
  <circle cx="1378" cy="810" r="4" fill="#f1bd57"/>
  <text x="1392" y="814" class="label" fill="#f4cf83">SÓ DURANTE RETENÇÃO</text>
  <text x="880" y="848" class="body">Ação contextual própria; separada dos controles frequentes.</text>
  <rect x="880" y="894" width="720" height="84" rx="16" fill="#211c13" stroke="#9b7335" stroke-width="1.3"/>
  <path d="M909 924v18m0 8v1" stroke="#f1bd57" stroke-width="3" stroke-linecap="round"/>
  <text x="938" y="930" class="action" fill="#ffe0a1">Encerrar Retenção com Segurança</text>
  <text x="938" y="954" class="note" fill="#d4c09c">Inicia a recuperação</text>
  <line x1="880" y1="1012" x2="1600" y2="1012" class="rule"/>
  <text x="880" y="1045" class="note">Forma retangular e tom âmbar distinguem esta ação de</text>
  <text x="880" y="1067" class="note">Pausar e Cancelar sem sugerir que seja um controle comum.</text>

  <line x1="48" y1="1170" x2="1632" y2="1170" class="rule"/>
  <text x="64" y="1200" class="note">PROPOSTA ESQUEMÁTICA · medidas para alinhar o visual; confirmar proporções e contraste na captura real antes da implementação.</text>
</svg>
